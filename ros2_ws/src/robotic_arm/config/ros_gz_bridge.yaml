# Bridge configuration file for ROS 2 and Gazebo integration
# This file defines the topics to be bridged between ROS 2 and Gazebo.

# Joint States (Gazebo to ROS)

- ros_topic_name: "joint_states"
  gz_topic_name: "/model/robotic_arm/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
  lazy: false 

# Joint Commands (ROS to Gazebo)
- ros_topic_name: "/amanda_cmd"
  gz_topic_name: "/model/robotic_arm/joint/Amanda/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  lazy: false

- ros_topic_name: "/sosuke_cmd"
  gz_topic_name: "/model/robotic_arm/joint/Sosuke/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  lazy: false

- ros_topic_name: "/nathan_cmd"
  gz_topic_name: "/model/robotic_arm/joint/Nathan/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  lazy: false

- ros_topic_name: "/henry_cmd"
  gz_topic_name: "/model/robotic_arm/joint/Henry/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  lazy: false

- ros_topic_name: "/Indy_cmd"
  gz_topic_name: "/model/robotic_arm/joint/Indy/cmd_pos"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  lazy: false

# gz topic published by Sensors plugin
- ros_topic_name: "camera_head/depth/camera_info"
  gz_topic_name: "camera_head/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true # Determines whether connections are created immediately at startup (when false) or only when data is actually requested by a subscriber (when true), helping to conserve system resources at the cost of potential initial delays in data flow.

# gz topic published by Sensors plugin
- ros_topic_name: "camera_head/depth/color/points"
  gz_topic_name: "camera_head/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  lazy: true
  
# Clock configuration
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  lazy: false
  

